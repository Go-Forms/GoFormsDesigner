# Publishes the extension. Tag a commit `v0.6.1` and push the tag; everything
# below is automatic.
#
# The version in package.json is the single source of truth - the tag has to
# match it, and the job fails loudly if it does not, because a mismatch is the
# one error a marketplace will happily accept and then serve forever.
#
# Secrets, all optional. A publishing step whose token is absent is skipped,
# so a repository with neither still produces a GitHub Release with the .vsix
# attached:
#
#   VSCE_PAT   Azure DevOps PAT with Marketplace: Manage, for the VS Code
#              Marketplace (the "goforms" publisher).
#   OVSX_PAT   Open VSX access token, for editors that cannot use Microsoft's
#              marketplace - VSCodium, Cursor, Gitpod, code-server.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attach the .vsix without publishing it
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: tool/go.mod
          cache-dependency-path: tool/go.mod

      - run: npm ci

      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $manifest"
            exit 1
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"

      - name: Verify before publishing
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm test
          (cd tool && go vet ./... && go test ./...)

      - name: Build the .vsix
        run: npx vsce package --out "goforms-designer-${{ env.VERSION || 'dev' }}.vsix"

      - name: Publish to the VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set - skipping the VS Code Marketplace."
            exit 0
          fi
          # Publishing needs two things, and they fail at different moments
          # with errors that do not say which is wrong. Checking the token
          # against the publisher first turns both into one clear message.
          publisher=$(node -p "require('./package.json').publisher")
          if ! npx vsce verify-pat "$publisher"; then
            echo "::error::VSCE_PAT is not valid for the '$publisher' publisher."
            echo "Either the token has expired or lacks Marketplace: Manage, or the"
            echo "publisher does not exist yet - create it once at"
            echo "https://marketplace.visualstudio.com/manage, then re-run this job."
            exit 1
          fi
          npx vsce publish --packagePath "goforms-designer-${{ env.VERSION }}.vsix"

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set - skipping Open VSX."
            exit 0
          fi
          npx ovsx publish "goforms-designer-${{ env.VERSION }}.vsix" -p "$OVSX_PAT"

      # Last, so a release never advertises a version that failed to publish.
      - name: Attach the .vsix to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: goforms-designer-*.vsix
          generate_release_notes: true
